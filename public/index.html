<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex 会话身份</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"></head>
<body>
  <header><img src="/icon.svg" alt="" width="28" height="28"><h1>会话身份</h1><span class="product">Codex</span><span id="connection" class="connection">连接中</span><button id="refresh" title="刷新" aria-label="刷新">↻</button></header>
  <main>
    <section class="toolbar"><label class="search"><span>搜索会话</span><input id="search" type="search" placeholder="名称、会话 ID 或目录"></label><label><span>Provider</span><select id="provider"><option value="">全部</option></select></label><label class="check"><input id="archived" type="checkbox">显示已归档</label></section>
    <div id="error" role="alert" hidden></div>
    <div class="workspace">
      <section class="sessions"><div class="section-title"><h2>会话</h2><span id="count">0</span><time id="updated"></time></div><div class="table-scroll"><table><thead><tr><th>会话</th><th>记录的 Provider</th><th>当前身份</th><th>最近更新</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" hidden>没有匹配的会话</p></section>
      <aside><h2>会话详情</h2><p id="no-selection">选择一个会话</p><div id="detail" hidden><h3 id="detail-title"></h3><dl><dt>会话 ID</dt><dd id="detail-id"></dd><dt>目录</dt><dd id="detail-cwd"></dd><dt>模型</dt><dd id="detail-model"></dd><dt>当前身份</dt><dd id="detail-identity">待运行时确认</dd></dl><label class="identity-label" for="identity">切换到</label><select id="identity"></select><button id="switch" disabled>切换身份</button><button id="cancel-switch" hidden>取消等待</button><p class="notice" id="switch-reason">运行时身份接口尚未接入</p></div><div class="identity-list"><h2>已登记身份</h2><ul id="identities"></ul></div></aside>
    </div>
    <section class="official-add"><h2>添加官方账号</h2><button id="add-official" type="button">+ 添加官方账号</button><div id="official-login" hidden><p id="login-status" role="status"></p><code id="login-code" hidden></code><a id="login-url" target="_blank" rel="noopener noreferrer" hidden>打开 OpenAI 授权页面</a><button id="cancel-login" type="button" hidden>取消登录</button></div></section>
  </main><script type="module" src="/app.js"></script>
</body></html>
